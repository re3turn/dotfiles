# dendrite tool definitions
# Regenerate: nix run .#dendrite -- generate -f dendrite.yaml -o nix/dendrite --lock
# nix/packages.nix auto-imports every subdirectory of nix/dendrite/.
# Target platforms match flake.nix supportedSystems: darwin/arm64, linux/amd64, linux/arm64.

tools:
  - name: cli/cli@v2.92.0
    asset:
      darwin/arm64: gh_{version}_macOS_arm64.zip
      linux/amd64: gh_{version}_linux_amd64.tar.gz
      linux/arm64: gh_{version}_linux_arm64.tar.gz
    bins:
      - gh

  - name: BurntSushi/ripgrep@15.1.0
    asset:
      darwin/arm64: ripgrep-{version}-aarch64-apple-darwin.tar.gz
      linux/amd64: ripgrep-{version}-x86_64-unknown-linux-musl.tar.gz
      linux/arm64: ripgrep-{version}-aarch64-unknown-linux-gnu.tar.gz
    version_prefix: ""
    bins:
      - rg

  - name: sharkdp/fd@v10.4.2
    asset:
      darwin/arm64: fd-v{version}-aarch64-apple-darwin.tar.gz
      linux/amd64: fd-v{version}-x86_64-unknown-linux-musl.tar.gz
      linux/arm64: fd-v{version}-aarch64-unknown-linux-musl.tar.gz
