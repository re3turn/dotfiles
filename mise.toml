[bootstrap.hooks]
pre-dotfiles = "mkdir -p ~/.config/mise && mise trust ~/.config/mise"

[dotfiles]
"~/.gitconfig" = "~/.dotfiles/.gitconfig"
"~/.zsh" = "~/.dotfiles/zshfiles"
"~/.zshrc" = "~/.dotfiles/zshfiles/.zshrc"
"~/.bashrc" = "~/.dotfiles/bashfiles/.bashrc"
"~/.dircolors" = "~/.dotfiles/zshfiles/dircolors"
"~/.npmrc" = "~/.dotfiles/npmfiles/.npmrc"
"~/.vim" = "~/.dotfiles/configfiles/nvim"
"~/.config/nvim" = "~/.dotfiles/configfiles/nvim"
"~/.config/ftplugin" = "~/.dotfiles/configfiles/ftplugin"
"~/.config/fzshell" = "~/.dotfiles/configfiles/fzshell"
"~/.config/ghostty" = "~/.dotfiles/configfiles/ghostty"
"~/.config/mise/config.toml" = "~/.dotfiles/configfiles/mise/config.toml"
"~/.config/mise/mise.lock" = "~/.dotfiles/configfiles/mise/mise.lock"
"~/.config/starship.toml" = "~/.dotfiles/configfiles/starship.toml"
"~/.config/fish/config.fish" = "~/.dotfiles/configfiles/fish/config.fish"
"~/.config/fish/fish_plugins" = "~/.dotfiles/configfiles/fish/fish_plugins"
"~/.config/fish/conf.d/fzf-custom.fish" = "~/.dotfiles/configfiles/fish/conf.d/fzf-custom.fish"
"~/.config/fish/setting" = "~/.dotfiles/configfiles/fish/setting"
"~/.config/fish/functions/fbr.fish" = "~/.dotfiles/fishfiles/functions/fbr.fish"
"~/.config/fish/functions/gcd.fish" = "~/.dotfiles/fishfiles/functions/gcd.fish"
"~/.config/fish/functions/fcd.fish" = "~/.dotfiles/fishfiles/functions/fcd.fish"
"~/.config/fish/functions/diff.fish" = "~/.dotfiles/fishfiles/functions/diff.fish"
"~/.config/fish/functions/vi.fish" = "~/.dotfiles/fishfiles/functions/vi.fish"
"~/.config/fish/functions/vim.fish" = "~/.dotfiles/fishfiles/functions/vim.fish"
"~/.config/fish/functions/fish_user_key_bindings.fish" = "~/.dotfiles/fishfiles/functions/fish_user_key_bindings.fish"
"~/.config/fish/functions/fed.fish" = "~/.dotfiles/fishfiles/functions/fed.fish"
"~/.config/fish/functions/fzf_find_file.fish" = "~/.dotfiles/fishfiles/functions/fzf_find_file.fish"
"~/.config/fish/functions/multicd.fish" = "~/.dotfiles/fishfiles/functions/multicd.fish"
"~/.config/fish/functions/last_history_item.fish" = "~/.dotfiles/fishfiles/functions/last_history_item.fish"
"~/.config/fish/functions/fish_should_add_to_history.fish" = "~/.dotfiles/fishfiles/functions/fish_should_add_to_history.fish"
"~/.config/fish/functions/gifit.fish" = "~/.dotfiles/fishfiles/functions/gifit.fish"
"~/.config/fish/completions/aws.fish" = "~/.dotfiles/fishfiles/completions/aws.fish"
"~/.local/bin/brew-safe-upgrade" = "~/.dotfiles/binfiles/brew-safe-upgrade"

[tasks.bootstrap]
description = "Install OS packages (Homebrew on macOS, apt on Ubuntu/Raspberry Pi OS)"
run = """
set -e
if [ "$(uname -s)" = Darwin ]; then
  brew bundle --file=./Brewfile
elif command -v apt-get >/dev/null 2>&1; then
  sudo apt-get update
  xargs -a ./apt-packages.txt sudo apt-get install -y
fi
"""
