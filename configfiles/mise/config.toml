[settings]
lockfile = true
lockfile_platforms = ["linux-arm64", "linux-arm64-musl", "linux-x64", "linux-x64-musl", "macos-arm64", "windows-x64"]
minimum_release_age = "3d"

# The go backend sets GOBIN to its own install dir, and `mise activate` runs
# after the shell rc files, so GOBIN only sticks when set here.
[env]
GOBIN = "{{env.HOME}}/go/bin"

[tools]
java = "zulu-25"
node = "24"
python = "latest"
rust = "latest"

gh = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
hexyl = "latest"
delta = "latest"
ghq = "latest"
starship = "latest"
grype = "latest"
syft = "latest"
trivy = "latest"
zellij = "latest"
sheldon = { version = "latest", os = ["linux", "macos"] }
neovim = "latest"
fzf = "latest"
pnpm = "latest"
uv = "latest"
jq = "latest"
# pyyaml has no wheel for Python 3.15 yet; drop `python` once it does
azure-cli = { version = "latest", python = "3.14" }
aws = { version = "latest", os = ["linux", "macos"] }
"aqua:dalance/procs" = "latest"
"aqua:knqyf263/pet" = "latest"
"aqua:simeji/jid" = "latest"
"aqua:d-kuro/gwq" = "latest"
# eza: brew on macOS, aqua on Linux (missing from apt on Debian bookworm;
# GitHub releases ship no macOS binaries)
"aqua:eza-community/eza" = { version = "latest", os = "linux" }

[tools.go]
version = "1.27.3"
go_default_packages = [
  "github.com/nao1215/gup",
  "github.com/toshimaru/nyan",
  "github.com/oklog/ulid/v2/cmd/ulid",
]
