[settings]
lockfile = true
minimum_release_age = "3d"

# The go backend sets GOBIN to its own install dir, and `mise activate` runs
# after the shell rc files, so GOBIN only sticks when set here.
[env]
GOBIN = "{{env.HOME}}/go/bin"

[tools]
java = "zulu-25"
node = "24"
python = "latest"
rust = "latest"

gh = "latest"
ripgrep = "latest"
fd = "latest"
bat = "latest"
hexyl = "latest"
delta = "latest"
ghq = "latest"
starship = "latest"
grype = "latest"
syft = "latest"
trivy = "latest"
zellij = "latest"
sheldon = "latest"
neovim = "latest"
fzf = "latest"
pnpm = "latest"
jq = "latest"
azure-cli = "latest"
aws = "latest"
xxh = "latest"
"aqua:dalance/procs" = "latest"
"aqua:knqyf263/pet" = "latest"
"aqua:simeji/jid" = "latest"
"aqua:d-kuro/gwq" = "latest"
# eza: brew on macOS, cargo on Linux (missing from apt on Debian bookworm)
"cargo:eza" = { version = "latest", os = "linux" }

[tools.go]
version = "1.26.7"
go_default_packages = [
  "github.com/nao1215/gup",
  "github.com/toshimaru/nyan",
  "github.com/oklog/ulid/v2/cmd/ulid",
]
